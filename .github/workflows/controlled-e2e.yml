name: Controlled E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Controlled unit and E2E tests
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ing-e2e]
    environment: controlled-e2e
    timeout-minutes: 45
    steps:
      - name: Check out the commit for this workflow run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run unit and cross-browser E2E tests
        run: ./gradlew --no-daemon check

      - name: Upload JUnit XML and HTML reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-e2e-test-reports-${{ github.run_id }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/test-results/e2eTest/
            build/reports/tests/e2eTest/
          if-no-files-found: warn
          retention-days: 7
