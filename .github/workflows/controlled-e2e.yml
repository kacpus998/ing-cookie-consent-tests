name: Controlled E2E

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of a commit already present on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate approved commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - name: Check out trusted main for validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate full SHA and its origin
        id: validate
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Input must be a full 40-character commit SHA" >&2
            exit 1
          fi

          git cat-file -e "${REQUESTED_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" HEAD; then
            echo "Requested commit is not reachable from the checked-out main commit" >&2
            exit 1
          fi

          resolved_sha="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          [[ "$resolved_sha" == "$REQUESTED_SHA" ]] || {
            echo "SHA must use the canonical lowercase form" >&2
            exit 1
          }
          printf 'commit_sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

  e2e:
    name: Sequential browser E2E
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, ing-e2e]
    environment: controlled-e2e
    timeout-minutes: 45
    steps:
      - name: Check out only the validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checkout identity
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT_SHA" ]]

      - name: Verify Java, Gradle wrapper, and Playwright dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          grep -F 'com.microsoft.playwright:playwright:1.51.0' build.gradle.kts
          test -x ./gradlew

      - name: Run Chromium E2E
        run: ./gradlew --no-daemon chromiumE2ETest

      - name: Run Firefox E2E
        run: ./gradlew --no-daemon firefoxE2ETest

      - name: Run WebKit E2E
        run: ./gradlew --no-daemon webkitE2ETest
