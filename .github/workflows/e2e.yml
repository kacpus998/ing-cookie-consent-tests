name: Cross-browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve test runtime dependencies
        run: ./gradlew testClasses

      - name: Install Playwright browser and system dependencies
        run: ./gradlew installPlaywrightBrowsers

      - name: Verify ${{ matrix.browser }} browser infrastructure
        run: ./gradlew "${{ matrix.browser }}BrowserSmokeTest"

      - name: Run ${{ matrix.browser }} E2E test
        run: ./gradlew "${{ matrix.browser }}E2ETest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-test-reports
          path: |
            build/test-results/cross-browser/${{ matrix.browser }}/
            build/reports/tests/cross-browser/${{ matrix.browser }}/
            build/test-results/browser-smoke/${{ matrix.browser }}/
            build/reports/tests/browser-smoke/${{ matrix.browser }}/
            build/test-diagnostics/${{ matrix.browser }}/
          if-no-files-found: warn
