name: Cross-browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ing-http-diagnostics:
    name: ING HTTP diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Make one HTTP request and inspect response markers
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          # One curl invocation follows redirects but never retries.
          curl --silent --show-error --location --max-redirs 10 \
            --output "$body_file" \
            --write-out 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECT_COUNT=%{num_redirects}\n' \
            https://www.ing.pl/

          python3 - "$body_file" <<'PY'
          from pathlib import Path
          import sys

          html = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          lower_html = html.lower()
          markers = {
              "ING_HTML_TITLE": "<title" in lower_html and "ing" in lower_html,
              "ING_COOKIE_CONSENT_HEADING": "ing bank śląski" in lower_html,
              "INCAPSULA_REQUEST_UNSUCCESSFUL": "request unsuccessful" in lower_html,
              "INCAPSULA_INCIDENT_ID": "incapsula incident id" in lower_html,
              "INCAPSULA_RESOURCE_PATH": "/_incapsula_resource" in lower_html,
          }
          for name, found in markers.items():
              print(f"{name}={'present' if found else 'absent'}")
          PY

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve test runtime dependencies
        run: ./gradlew testClasses

      - name: Install Playwright browser and system dependencies
        run: ./gradlew installPlaywrightBrowsers

      - name: Verify ${{ matrix.browser }} browser infrastructure
        run: ./gradlew "${{ matrix.browser }}BrowserSmokeTest"

      - name: Run ${{ matrix.browser }} E2E test
        run: ./gradlew "${{ matrix.browser }}E2ETest"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-test-reports
          path: |
            build/test-results/cross-browser/${{ matrix.browser }}/
            build/reports/tests/cross-browser/${{ matrix.browser }}/
            build/test-results/browser-smoke/${{ matrix.browser }}/
            build/reports/tests/browser-smoke/${{ matrix.browser }}/
            build/test-diagnostics/${{ matrix.browser }}/
          if-no-files-found: warn
